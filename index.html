<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Torch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>SMART TORCH</h1>

        <p class="subtitle">Control Your Light</p>

        <!-- Bulb -->
        <div class="bulb-box">

            <div class="bulb" id="bulb">
                <div class="bulb-light"></div>
            </div>

            <div class="base"></div>

        </div>

        <!-- Status -->
        <h2 id="status">TORCH IS OFF</h2>

        <!-- Buttons -->
        <div class="buttons">

            <button class="on-btn" onclick="turnOn()">
                ON
            </button>

            <button class="off-btn" onclick="turnOff()">
                OFF
            </button>

        </div>

    </div>


    <script src="style.js"></script>

</body>
</html>
